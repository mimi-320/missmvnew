<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>初期設定 - 管理人登録</title></head>
<body>
    <h2>システム管理者（管理人）の新規登録</h2>
    <p>この画面は管理人が一人もいない時だけ表示されます。</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">管理人を登録してログインへ</button>
    </form>
</body>
</html>
