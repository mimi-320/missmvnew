{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>初期設定 - パスワード変更</title>
    <link rel="stylesheet" href="{% static 'css/manager.css' %}">
</head>
<body class="dark-page">
    <div class="setup-box">
        <h2>セキュリティ設定</h2>
        <p class="subtitle">支配人として初めてログインされました。</p>
        <p class="highlight">セキュリティのため、初期パスワードを独自の新しいパスワードに変更してください。</p>
        
        <hr class="dark-hr">

        <form method="post">
            {% csrf_token %}
            
            <div class="form-content">
                {{ form.as_p }}
            </div>

            <div class="btn-area">
                <button type="submit" class="btn-navy-dark">
                    パスワードを変更して利用を開始する
                </button>
            </div>
        </form>
    </div>
</body>
</html>
