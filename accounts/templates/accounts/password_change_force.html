<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>初期設定 - パスワード変更</title>
</head>
<body>
    <div style="max-width: 500px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px;">
        <h2>🔐 セキュリティ設定</h2>
        <p>支配人として初めてログインされました。</p>
        <p><strong>セキュリティのため、初期パスワードを独自の新しいパスワードに変更してください。</strong></p>
        <hr>

        <form method="post">
            {% csrf_token %}
            
            {{ form.as_p }}

            <div style="margin-top: 20px;">
                <button type="submit" style="background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
                    パスワードを変更して利用を開始する
                </button>
            </div>
        </form>
    </div>
</body>
</html>
