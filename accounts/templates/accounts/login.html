{% load static %} <!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - Miss Mv</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-page"> <div class="login-box">
    <h2>Miss Mv</h2>
    <p>IDとパスワードを入力してください</p>
    
    <form method="post">
        {% csrf_token %} 
        <div class="form-group-login">
            <input type="text" name="username" placeholder="ユーザーID" required>
        </div>
        <div class="form-group-login">
            <input type="password" name="password" placeholder="パスワード" required>
        </div>
        {% if form.errors %}
            <p class="error-msg">IDかパスワードが違います</p>
        {% endif %}
        <button type="submit" class="btn-navy">ログイン</button>
    </form>
</div>
