<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>週間スケジュール生成 - 支配人管理画面</title>
    <style>
        .report-box { background: #f4f4f4; padding: 15px; border-radius: 8px; border-left: 5px solid #007bff; margin: 20px 0; }
        .success { color: green; font-weight: bold; }
        .error { color: red; }
    </style>
</head>
<body>

    <h1>週間スケジュール自動一括生成</h1>
    <p>指定した開始日から<strong>「1週間分（7日間）」</strong>のスケジュールを自動で組み立てます。</p>
    
    <div style="background-color: #fff3f3; padding: 10px; border: 1px solid red; color: red;">
        <strong>注意：</strong>実行すると、指定期間の既存の予定はすべて削除され、新しく作り直されます。
    </div>

    <hr>

    {% if reports %}
        <div class="report-box">
            <h3>生成レポート</h3>
            <ul>
                {% for line in reports %}
                    <li>{{ line }}</li>
                {% endfor %}
            </ul>
        </div>
        <hr>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        
        <p>
            <label for="target_date"><strong>開始日を選択してください：</strong></label><br>
            <small>※選択した日から7日分のスケジュールを生成します</small><br>
            <input type="date" name="target_date" id="target_date" required>
        </p>

        <button type="submit" style="padding: 10px 20px; font-size: 1.1em; cursor: pointer;">
            1週間分をまとめて生成する
        </button>
    </form>

    <br>
    <div style="margin-top: 20px;">
        <a href="{% url 'schedulerapp:schedule_list' %}">作成済みのスケジュールを確認する</a><br><br>
        <a href="{% url 'accounts:manager_Top' %}">← 支配人トップページへ戻る</a>
    </div>

</body>
</html>
