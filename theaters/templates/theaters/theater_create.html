{% extends 'admin_base.html' %}

{% block title %}映画館登録 | 管理人専用{% endblock %}

{% block content %}
<h2>新しい映画館を登録する</h2>

<div class="form-card">
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label>店舗名:</label>
            {{ form.name }}
        </div>

        <div class="form-group">
            <label>住所:</label>
            {{ form.address }}
        </div>

        <div class="form-group">
            <label>所有スクリーン数:</label>
            {{ form.total_screens }}
        </div>

        <div class="button-container">
            <button type="submit" class="btn-navy btn-small">映画館を追加する</button>
            <a href="{% url 'accounts:admin_Top' %}" class="btn-navy btn-small">戻る</a>
        </div>
    </form>
</div>
{% endblock %}
