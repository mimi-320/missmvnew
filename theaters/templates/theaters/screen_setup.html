{% extends 'admin_base.html' %}

{% block title %}シアター設定{% endblock %}

{% block content %}
    <h2>「{{ theater.name }}」のシアター設定</h2>
    <p>全部で <strong>{{ theater.total_screens }}</strong> つのシアターがあります。各シアターの最大席数を入力してください。</p>

    <div class="form-card">
        <form method="post">
            {% csrf_token %}
            <table class="form-table"> 
                <thead>
                    <tr>
                        <th>シアター番号</th>
                        <th>座席数（キャパシティ）</th>
                    </tr>
                </thead>
                <tbody>
                    {% for i in screen_range %}
                        <tr>
                            <td><strong>シアター {{ i }}</strong></td>
                            <td>
                                <input type="number" name="capacity_{{ i }}" required placeholder="例: 350"> 
                                <span style="margin-left: 5px;">席</span>
                                </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
            
            <div class="button-container">
                <button type="submit" class="btn-navy">全てのシアターを登録する</button>
                <a href="{% url 'theaters:theater_list' %}" class="btn-navy">戻る</a>
            </div>
        </form>
    </div>
{% endblock %}
